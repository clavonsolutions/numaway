name: CI — Numaway Quality Gates

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─── 1. Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build (SSG)
        run: npm run build

      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── 2. Code quality gates ───────────────────────────────────────────────────
  code-quality:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Gate — no-lovable-strings
        run: bash scripts/ci/no-lovable-strings.sh

      - name: Gate — no-hex-literal
        run: bash scripts/ci/no-hex-literal.sh

      - name: Gate — no-external-image-host
        run: bash scripts/ci/no-external-image-host.sh

      - name: Gate — legal-config-required-keys
        run: bash scripts/ci/legal-config-required-keys.sh

      - name: Gate — nap-consistency
        run: bash scripts/ci/nap-consistency.sh

  # ─── 3. Build-artefact gates ─────────────────────────────────────────────────
  artefact-gates:
    name: Build Artefact Gates
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artefact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Gate — prerender-coverage
        run: bash scripts/ci/prerender-coverage.sh

      - name: Gate — js-disabled-content-check
        run: bash scripts/ci/js-disabled-content-check.sh

      - name: Gate — meta-completeness
        run: bash scripts/ci/meta-completeness.sh

      - name: Gate — image-floor-check
        run: bash scripts/ci/image-floor-check.sh

      - name: Gate — link-check
        run: bash scripts/ci/link-check.sh

  # ─── 4. Sitemap + robots ─────────────────────────────────────────────────────
  seo-gates:
    name: SEO Gates
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Gate — sitemap-coverage
        run: bash scripts/ci/sitemap-coverage.sh

      - name: Gate — robots-allow-prod-only
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            MODE=production bash scripts/ci/robots-allow-prod-only.sh
          else
            MODE=staging bash scripts/ci/robots-allow-prod-only.sh
          fi

  # ─── 5. Runtime gates (preview deploy required) ──────────────────────────────
  # Lighthouse and axe gates run against the deployed preview URL.
  # They are skipped on feature branches where no preview is deployed.
  runtime-gates:
    name: Runtime Gates (Lighthouse + axe)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download dist artefact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Start preview server
        run: npm run preview &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Gate — lighthouse-budget
        run: bash scripts/ci/lighthouse-budget.sh
        continue-on-error: true

      - name: Gate — a11y-axe
        run: bash scripts/ci/a11y-axe.sh
        continue-on-error: true
